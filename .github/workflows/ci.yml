name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The decision layer is the sibling project, not a dependency on PyPI yet. Installing it
      # from source means the full engine -- not just the fallback policy -- is what CI
      # exercises.
      - name: Install the decision layer from source
        run: |
          git clone --depth 1 https://github.com/iamvazghen/jev-governor ../jev-governor
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e "../jev-governor" pytest

      - name: Confirm the interpreter is the one under test
        run: uv run python -c "import sys; print(sys.version)"

      - name: Test
        run: uv run pytest -q

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The manifests are the plugin's public contract. A typo in one of them is the kind of
      # thing that only shows up when somebody tries to install it, so check it on every push
      # instead.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin and the marketplace
        run: claude plugin validate .
