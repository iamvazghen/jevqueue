name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev,langchain,pydantic-ai]"

      - name: Confirm the interpreter is the one under test
        run: uv run python -c "import sys; print(sys.version)"

      - name: Test
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check jevqueue tests hooks mcp scripts examples bench

      - name: Types
        run: uv run mypy

  bare-install:
    # Its own job, in its own environment, on purpose. The check proves the package is usable
    # with **no** optional extras installed -- and `langchain-core` pulls in `jsonschema`, so
    # running it beside the adapter extras would prove nothing. An environment that has the
    # extras cannot demonstrate the absence of them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the package and nothing else
        run: |
          uv venv --python 3.12
          uv pip install -e .

      - name: Prove every module imports and the unguarded paths refuse
        run: uv run python scripts/check_bare_install.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build the distribution
        run: uv build
      - name: Check the metadata renders on PyPI
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The manifests are the plugin's public contract. A typo in one of them is the kind of
      # thing that only shows up when somebody tries to install it, so check it on every push
      # instead.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate the plugin and the marketplace
        run: claude plugin validate --strict .
